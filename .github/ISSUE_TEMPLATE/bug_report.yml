name: Relatar problema
description: Informe um erro encontrado em um exercício ou na documentação
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Descrição do problema
      description: Explique claramente o erro encontrado.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Descreva os passos necessários para reproduzir o problema.
      placeholder: |
        1. Execute ...
        2. Informe ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: Explique o que deveria acontecer.
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Linguagem relacionada
      options:
        - Python
        - JavaScript
        - Java
        - Não se aplica
    validations:
      required: true
